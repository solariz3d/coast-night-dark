[INCLUDE]
INCLUDE = common/conditions.ini, common/Benner900conditions.ini, common/materials_track.ini

[Material_Water]
Materials = Water
Type = SEA ; Available values: LAKE, POND, POOL, SEA, OCEAN

[Material_Water]
Materials = Pool_water
Type = POOL ; Available values: LAKE, POND, POOL, SEA, OCEAN

[SHADER_REPLACEMENT_0]
MATERIALS = Track
PROP_... = ksAmbient, 0.25 ; (0.15 dark - 0.5 light) Controls base brightness under shadow/no lighting
PROP_... = ksDiffuse, 0.25 ; (0.15 dark - 0.5 light) Controls brightness of lit surfaces (no shadow)
PROP_... = ksSpecular, 0.2 ; (0.05 dull - 1.0 shiny) Controls brightness of lighting source reflection
PROP_... = ksSpecularEXP, 100 ; (5 matte - 1000 polished) Controls width of lighting source reflection and the blurriness of general reflections (lower is wider/blurrier, higher is sharper)
PROP_... = sunSpecular, 6 ; (0 dull - 10 shiny) Controls brightness of the special lighting source reflection from the sun
PROP_... = sunSpecularEXP, 200 ; (200 matte - 1000 polished) Controls width of the special lighting source reflection from the sun (lower is wider, higher is sharper)
PROP_... = fresnelMaxLevel, 0.15 ; (0 plastic - 1 metal/chrome) Controls clamped maximum amount of metallic effect
PROP_... = fresnelEXP, 6 ; (2 - 6) Controls falloff of metallic effect
PROP_... = fresnelC, 0.05 ; (0.01 - 0.05) Controls minimum level of metallic effect



[MATERIAL_ADJUSTMENT_...]
CONDITION = NIGHT_SHARP
VISIBILITY_LEVEL = 1
MATERIALS = Tracklight
KEY_0 = ksEmissive
VALUE_0 = 1, 0.95, 0.8, 10
VALUE_0_OFF = 1,1,1,0
ACTIVE = 1

[MATERIAL_ADJUSTMENT_...]
CONDITION = NIGHT_SHARP
VISIBILITY_LEVEL = 1
MATERIALS = Stadiumlight
KEY_0 = ksEmissive
VALUE_0 = 1, 0.95, 0.8, 0
VALUE_0_OFF = 1,1,1,0
ACTIVE = 1

[MATERIAL_ADJUSTMENT_...]
CONDITION = NIGHT_SHARP
VISIBILITY_LEVEL = 1
MATERIALS = Finishlight
KEY_0 = ksEmissive
VALUE_0 = 1, 0.95, 0.8, 10
VALUE_0_OFF = 1,1,1,0
ACTIVE = 1

[MATERIAL_ADJUSTMENT_...]
CONDITION = NIGHT_SHARP
VISIBILITY_LEVEL = 1
MATERIALS = Yachtwindow
KEY_0 = ksEmissive
VALUE_0 = 1, 0.95, 0.8, 1
VALUE_0_OFF = 1,1,1,0
ACTIVE = 1

[LIGHT_SERIES_...]
ACTIVE = 0 ; coast-night-dark: the stadium floods cast no light
CONDITION = NIGHT_SHARP
MATERIALS = Stadiumlight  ; or, you could use "MESHES = material:glowing_material?"
OFFSET = X, Y, Z  ; optional offset in meters
DIRECTION = NORMAL
SPOT = 120  ; or 0 by default for line lights
SPOT_SHARPNESS = 0.3
RANGE = 350
RANGE_GRADIENT_OFFSET = 0.2
COLOR = 1, 0.95, 0.9, 10
CONDITION_OFFSET =  ; by default is not set
; How light source fades with distance (for performance reasons)
FADE_AT = 2500
FADE_SMOOTH = 50
